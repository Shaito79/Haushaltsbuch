<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Haushaltskasse</title>

    
</head>
<body>

<div class="container">

    <h1>Haushaltskasse</h1>

    <div class="card">
        <h2>Kontostand</h2>
        <p class="kontostand">1.250,00 €</p>
    </div>

    <div class="card">
        <h2>Monats- / Jahresauswertung</h2>

        <label for="monat">Monat</label>
        <select id="monat">
            <option>Januar</option>
            <option>Februar</option>
            <option>März</option>
            <option>April</option>
            <option>Mai</option>
            <option>Juni</option>
            <option>Juli</option>
            <option>August</option>
            <option>September</option>
            <option>Oktober</option>
            <option>November</option>
            <option>Dezember</option>
        </select>

        <label for="jahr">Jahr</label>
        <select id="jahr"></select>

        <button>Anzeigen</button>
    </div>

    <div class="card">
        <h2>Neue Buchung</h2>

        <label>Typ</label>
        <select>
            <option>Einnahme</option>
            <option>Ausgabe</option>
        </select>

        <label>Betrag</label>
        <input type="number">

        <label>Kategorie</label>
        <select>
            <option>Lebensmittel</option>
            <option>Miete</option>
            <option>Freizeit</option>
            <option>Versicherung</option>
        </select>

        <label>Datum</label>
        <input type="date">

        <label>Beschreibung</label>
        <input type="text">

        <button>Speichern</button>
    </div>

    <div class="card">
        <h2>Buchungen</h2>

        <table>
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Kategorie</th>
                    <th>Betrag</th>
                    <th>Aktion</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>01.07.2026</td>
                    <td>Gehalt</td>
                    <td>2500 €</td>
                    <td>
                        <button>Bearbeiten</button>
                    </td>
                </tr>

                <tr>
                    <td>02.07.2026</td>
                    <td>Miete</td>
                    <td>-900 €</td>
                    <td>
                        <button>Löschen</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script class="js"></script>

</body>
</html>
